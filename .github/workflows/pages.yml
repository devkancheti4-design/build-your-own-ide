# Tests everything, then publishes the IDE to GitHub Pages.
# Enable it under Settings → Pages → Source: GitHub Actions.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rust tests (language + every level)
        run: cargo test --manifest-path core/Cargo.toml
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build (wasm + type check + bundle)
        working-directory: web
        run: npm run build
      - name: Verify every challenge through the wasm module
        working-directory: web
        run: node scripts/verify.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
